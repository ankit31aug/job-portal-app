name: job_portal
description: A Job Portal mobile application for NABH, NABL, NABCB and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # File Handling
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  open_file: ^3.5.8
  image_picker: ^1.1.2

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  badges: ^3.1.2
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3
  readmore: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
